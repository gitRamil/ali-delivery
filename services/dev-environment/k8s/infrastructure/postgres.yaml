apiVersion: apps/v1
kind: Deployment
metadata:
  name: ed-postgres
  namespace: ed-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ed-postgres
  template:
    metadata:
      labels:
        app: ed-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15.2
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: postgres-password
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ed-postgres
  namespace: ed-namespace
spec:
  selector:
    app: ed-postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ed-namespace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi