apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-service
  namespace: ed-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: location-service
  template:
    metadata:
      labels:
        app: location-service
    spec:
      containers:
      - name: location-service
        image: your-registry/location-service:1.0
        ports:
        - containerPort: 80
        env:
        - name: ConnectionStrings__PostgreSQL
          value: "Host=ed-postgres;Port=5432;Database=location_db;Username=postgres;Password=$(POSTGRES_PASSWORD)"
        - name: RabbitMQ__Host
          value: "ed-rabbitmq"
        - name: RabbitMQ__UserName
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: rabbitmq-username
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: rabbitmq-password
        - name: Seq__Host
          value: "http://ed-seq"
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: location-service
  namespace: ed-namespace
spec:
  selector:
    app: location-service
  ports:
  - port: 80
    targetPort: 80